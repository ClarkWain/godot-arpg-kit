name: Tests

on:
  push:
    branches: [master, main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        godot: ['4.5', '4.6.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test runner failure handling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Install Godot runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxcursor1 libxi6 libxinerama1 libxrandr2 libxrender1 \
            libgl1 libglx-mesa0 libasound2t64 libpulse0
      - name: Download and verify official Godot
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --show-error --location --retry 3 "$release/$archive" -o "$archive"
          curl --fail --show-error --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          awk -v file="$archive" '$2 == file {print; found=1} END {if (!found) exit 1}' SHA512-SUMS.txt > selected.sha512
          sha512sum --check selected.sha512
          unzip -q "$archive"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and run all modules
        run: python3 tools/run_tests.py
      - name: Preserve current-run logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-godot-${{ matrix.godot }}
          path: .godot/test-results/
          if-no-files-found: warn

  release:
    name: Publish version release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$notes" --latest
          fi
